databases:
  - name: pos-admin-db
    databaseName: pos_admin
    user: pos_admin

services:
  - type: web
    name: pos-admin-api
    runtime: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "cd backend && daphne -b 0.0.0.0 -p $PORT erp_sales.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pos-admin-db
          property: connectionString
